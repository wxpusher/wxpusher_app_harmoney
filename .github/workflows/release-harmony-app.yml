name: Release HarmonyOS APP

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 GitHub Release'
        required: false
        type: boolean
        default: false
      release_notes:
        description: '发布说明（可选）'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # ========== 环境配置 ==========

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 安装 HarmonyOS Command Line Tools
    # SDK 包由自己托管，通过 secrets/vars 配置下载地址和版本，完全可控
    - name: Setup HarmonyOS SDK
      uses: ./.github/actions/setup-harmony-sdk
      with:
        sdk-version: ${{ vars.HARMONY_SDK_VERSION }}
        sdk-download-url: ${{ secrets.HARMONY_SDK_DOWNLOAD_URL }}
        sdk-checksum: ${{ vars.HARMONY_SDK_CHECKSUM }}

    # ========== 签名配置 ==========

    # 新建目录，用于保存签名密钥（与 .gitignore 路径对齐）
    # hvigor (type: HarmonyOS) 要求签名文件必须放在名为 material 的子目录下
    - name: Prepare signing directory
      run: mkdir -p secrets/harmony/material

    # 从 Secrets 还原签名文件
    - name: Restore signing files
      env:
        P12_BASE64: ${{ secrets.HARMONY_SIGN_P12_BASE64 }}
        CER_BASE64: ${{ secrets.HARMONY_SIGN_CER_BASE64 }}
        P7B_BASE64: ${{ secrets.HARMONY_SIGN_PROFILE_BASE64 }}
        MATERIAL_BASE64: ${{ secrets.HARMONY_SIGN_MATERIAL_BASE64 }}
      run: |
        echo "$P12_BASE64" | base64 -d > secrets/harmony/publish_sign.p12
        echo "$CER_BASE64" | base64 -d > secrets/harmony/publish_release.cer
        echo "$P7B_BASE64" | base64 -d > secrets/harmony/publish_release.p7b
        # 还原 material 目录（zip 根目录直接含 ac/ce/fd 子目录）
        echo "$MATERIAL_BASE64" | base64 -d > /tmp/material.zip
        unzip -q /tmp/material.zip -d secrets/harmony/material
        rm /tmp/material.zip

    # 将 build-profile.json5 中的占位符替换为实际签名信息
    - name: Inject release signing config
      env:
        KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
      run: |
        CERT_PATH="$(pwd)/secrets/harmony/material/publish_release.cer"
        PROFILE_PATH="$(pwd)/secrets/harmony/material/publish_release.p7b"
        STORE_FILE="$(pwd)/secrets/harmony/material/publish_sign.p12"

        sed -i "s|__HARMONY_CERT_PATH__|$CERT_PATH|g"       build-profile.json5
        sed -i "s|__HARMONY_PROFILE_PATH__|$PROFILE_PATH|g" build-profile.json5
        sed -i "s|__HARMONY_STORE_FILE__|$STORE_FILE|g"     build-profile.json5
        sed -i "s|__HARMONY_KEY_ALIAS__|$KEY_ALIAS|g"       build-profile.json5
        sed -i "s|__HARMONY_KEY_PASSWORD__|$KEY_PASSWORD|g"  build-profile.json5
        sed -i "s|__HARMONY_STORE_PASSWORD__|$STORE_PASSWORD|g" build-profile.json5

        # 将产品的 signingConfig 从本地开发用的 "default" 切换为发布签名 "release"
        sed -i 's/"signingConfig": "default"/"signingConfig": "release"/' build-profile.json5

        # 验证：占位符全部替换 + signingConfig 已切换为 release
        if grep -q '__HARMONY_' build-profile.json5; then
          echo "::error::build-profile.json5 仍有未替换的占位符："
          grep '__HARMONY_' build-profile.json5
          exit 1
        fi
        if ! grep -q '"signingConfig": "release"' build-profile.json5; then
          echo "::error::signingConfig 未成功切换为 release"
          exit 1
        fi

        echo "--- build-profile.json5 (after injection) ---"
        cat build-profile.json5
        echo "--- signing files ---"
        ls -lh secrets/harmony/material/

    # ========== 依赖安装 ==========

    - name: Install ohpm dependencies
      run: ohpm install --all

    # ========== 构建 ==========

    - name: Build HarmonyOS APP (release)
      run: |
        hvigorw assembleApp \
          --mode project \
          -p product=default \
          -p buildMode=release \
          --no-daemon

    # ========== 产物处理 ==========

    # 读取版本号，用于产物命名和 Release
    - name: Get app version
      id: get_version
      run: |
        VERSION=$(grep '"versionName"' AppScope/app.json5 | head -1 | sed 's/.*"versionName": *"\([^"]*\)".*/\1/')
        echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "App version: $VERSION"

    # 找到并重命名 APP 产物
    - name: Prepare APP file
      id: prepare
      run: |
        APP_FILE=$(find . -path "*/build/outputs/app/*-release.app" | head -1)
        if [ -z "$APP_FILE" ]; then
          echo "::error::未找到 .app 产物，构建可能未成功"
          exit 1
        fi
        RELEASE_APP="./wxpusher-harmony-v${{ steps.get_version.outputs.APP_VERSION }}-${{ github.run_number }}.app"
        cp "$APP_FILE" "$RELEASE_APP"
        echo "APP_PATH=$RELEASE_APP" >> $GITHUB_OUTPUT

    # 上传 APP 产物，方便下载存档
    - name: Upload APP artifact
      uses: actions/upload-artifact@v4
      with:
        name: wxpusher-harmony-v${{ steps.get_version.outputs.APP_VERSION }}-${{ github.run_number }}.app
        path: ${{ steps.prepare.outputs.APP_PATH }}

    # ========== GitHub Release（可选） ==========

    - name: Create GitHub Release
      if: ${{ inputs.create_release }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.APP_VERSION }}-HarmonyOS
        name: WxPusher HarmonyOS v${{ steps.get_version.outputs.APP_VERSION }}
        body: |
          ## WxPusher HarmonyOS v${{ steps.get_version.outputs.APP_VERSION }}

          ${{ github.event.inputs.release_notes || '新版本发布' }}

          ---
          构建信息
          - 分支: `${{ github.ref_name }}`
          - Commit: `${{ github.sha }}`
          - Run ID: `${{ github.run_id }}`
          - 构建时间: `${{ github.event.repository.updated_at }}`
        draft: true
        prerelease: false
        files: ${{ steps.prepare.outputs.APP_PATH }}
        generate_release_notes: true
